<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Maiara Cell - Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f0eb;
            --card-bg: #ffffff;
            --primary-dark: #1a1a1a;
            --gold-accent: #c5a059;
            --whatsapp-green: #25d366;
            --text-main: #2d2d2d;
            --text-muted: #666666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 40px; }

        header {
            background-color: #111111;
            color: #ffffff;
            padding: 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold-accent);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-info h1 { font-size: 20px; font-weight: 700; color: #fdfdfd; }
        .brand-info p { font-size: 12px; color: var(--gold-accent); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .header-icons { display: flex; gap: 12px; }
        .header-icons a {
            width: 40px; height: 40px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; color: #ffffff;
            font-size: 20px; text-decoration: none;
        }
        .ico-wa { background-color: var(--whatsapp-green); }
        .ico-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 12px; }
        .category-title { font-size: 18px; font-weight: 700; margin: 25px 0 15px 5px; color: var(--primary-dark); border-left: 4px solid var(--gold-accent); padding-left: 8px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; flex-direction: column; position: relative;
        }

        .badge-container { position: absolute; top: 10px; left: 10px; z-index: 2; }
        .badge { background-color: var(--gold-accent); color: #ffffff; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }

        .card-img-box {
            width: 100%; height: 230px; background-color: #ffffff;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }
        .card-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .card-content { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .brand-label { font-size: 11px; font-weight: 600; color: var(--gold-accent); text-transform: uppercase; margin-bottom: 2px; }
        .product-name { font-size: 16px; font-weight: 700; color: var(--primary-dark); margin-bottom: 6px; }

        .specs-list { list-style: none; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); }
        .specs-list li { margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .specs-list li i { color: var(--gold-accent); font-size: 11px; }

        .price-section { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 10px; border-top: 1px solid #eeeeee; }
        .price-pix-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .price-pix-value { font-size: 20px; font-weight: 700; color: var(--primary-dark); }
        .price-card-value { font-size: 11px; color: var(--text-muted); text-align: right; }

        .card-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background-color: #fafafa; border-top: 1px solid #f0f0f0; }
        .whatsapp-btn-full {
            width: 100%; background-color: var(--whatsapp-green); color: white;
            padding: 10px; border-radius: 6px; display: flex; align-items: center;
            justify-content: center; gap: 8px; font-weight: 700; font-size: 13px;
            text-decoration: none; box-shadow: 0 2px 5px rgba(37, 211, 102, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">
            <h1>Black Maiara Cell</h1>
            <p>Catálogo Oficial • Pronta Entrega</p>
        </div>
        <div class="header-icons">
            <a href="https://wa.me/5584997017888?text=Olá,%20vim%20pelo%20catálogo%20e%20gostaria%20de%20tirar%20duvidas!" class="ico-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="https://instagram.com/maiara_cel" class="ico-ig" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </header>

    <div class="container" id="catalogo-container"></div>

    <script>
        const waNumber = "5584997017888";

        const produtos = [
            {
                categoria: "Realme",
                nome: "Realme C100x NFC",
                specs: ["128GB / 256GB • 4GB RAM", "Câmera 50MP com IA", "NFC Integrado • Design Fluido"],
                precoPix: "R$ 1.250,00",
                precoCard: "12x R$ 117,71",
                selo: "NFC",
                img: "Realme C100x NFC.jpeg"
            },
            {
                categoria: "Realme",
                nome: "Realme C85 Pro NFC",
                specs: ["256GB • 8GB RAM", "Câmera Dupla 50MP", "Carregamento Rápido • NFC"],
                precoPix: "R$ 1.550,00",
                precoCard: "12x R$ 145,96",
                selo: "Pro NFC",
                img: "Realme C85 Pro.jpeg"
            },
            {
                categoria: "Realme",
                nome: "Realme Note 70",
                specs: ["256GB • 8GB RAM", "Ecrã Fluido de 90Hz", "Bateria de Longa Duração"],
                precoPix: "R$ 1.040,00",
                precoCard: "12x R$ 97,93",
                selo: "Destaque",
                img: "Realme Note 70.jpeg"
            },
            {
                categoria: "Realme",
                nome: "Realme C75 NFC",
                specs: ["128GB / 256GB • 8GB RAM", "Câmera Principal 50MP", "Construção Ultra Resistente • NFC"],
                precoPix: "R$ 1.150,00",
                precoCard: "12x R$ 108,29",
                selo: "NFC",
                img: "Realme C75.jpeg"
            },
            {
                categoria: "Realme",
                nome: "Realme Note 60x",
                specs: ["64GB / 128GB • RAM Expansível", "Bateria de 5000mAh", "Excelente Custo-Benefício"],
                precoPix: "R$ 870,00",
                precoCard: "12x R$ 81,92",
                selo: "Oferta",
                img: "Realme Note 60x.jpeg"
            },
            {
                categoria: "Realme",
                nome: "Realme P4 Lite NFC",
                specs: ["128GB • 4GB RAM", "Design Leve e Moderno", "Conectividade NFC"],
                precoPix: "R$ 980,00",
                precoCard: "12x R$ 92,28",
                selo: "NFC",
                img: "Realme P4 Lite NFC.jpeg"
            },
            {
                categoria: "Realme",
                nome: "Realme C71",
                specs: ["128GB • 4GB RAM", "Câmera HD", "Bateria de Longa Duração"],
                precoPix: "R$ 1.030,00",
                precoCard: "12x R$ 97,00",
                selo: "",
                img: "Realme C71.jpeg"
            },
            {
                categoria: "Realme",
                nome: "Realme C85",
                specs: ["256GB • 8GB RAM", "Desempenho Rápido", "Tela Grande HD+"],
                precoPix: "R$ 1.450,00",
                precoCard: "12x R$ 136,54",
                selo: "Popular",
                img: "Realme C85.jpeg"
            }
        ];

        const container = document.getElementById('catalogo-container');
        const categorias = [...new Set(produtos.map(p => p.categoria))];

        categorias.forEach(cat => {
            const sectionTitle = document.createElement('h2');
            sectionTitle.className = 'category-title';
            sectionTitle.innerText = cat;
            container.appendChild(sectionTitle);

            const grid = document.createElement('div');
            grid.className = 'grid';

            produtos.filter(p => p.categoria === cat).forEach(prod => {
                const msg = encodeURIComponent(`Olá! Gostaria de comprar o ${prod.nome} anunciado no catálogo por ${prod.precoPix} no Pix.`);
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="badge-container">
                        ${prod.selo ? `<span class="badge">${prod.selo}</span>` : ''}
                    </div>
                    <div class="card-img-box">
                        <img src="${encodeURIComponent(prod.img)}" alt="${prod.nome}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <span class="brand-label">${prod.categoria}</span>
                        <h3 class="product-name">${prod.nome}</h3>
                        <ul class="specs-list">
                            ${prod.specs.map(s => `<li><i class="fa-solid fa-check"></i> ${s}</li>`).join('')}
                        </ul>
                        <div class="price-section">
                            <div>
                                <span class="price-pix-label">No Pix</span>
                                <div class="price-pix-value">${prod.precoPix}</div>
                            </div>
                            <div class="price-card-value">
                                ou ${prod.precoCard}
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="https://wa.me/${waNumber}?text=${msg}" target="_blank" class="whatsapp-btn-full">
                            <i class="fa-brands fa-whatsapp"></i> Comprar pelo WhatsApp
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            container.appendChild(grid);
        });
    </script>
</body>
</html>
