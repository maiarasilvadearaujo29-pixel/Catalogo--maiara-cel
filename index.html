            font-size: 20px; text-decoration: none;

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; flex-direction: column; position: relative;

        .badge { background-color: var(--gold-accent); color: #ffffff; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }

            width: 100%; height: 220px; background-color: #ffffff;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }
        .card-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .card-content { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .brand-label { font-size: 11px; font-weight: 600; color: var(--gold-accent); text-transform: uppercase; margin-bottom: 2px; }
        .product-name { font-size: 16px; font-weight: 700; color: var(--primary-dark); margin-bottom: 6px; }

        .specs-list { list-style: none; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); }
        .specs-list li { margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .specs-list li i { color: var(--gold-accent); font-size: 11px; }

        .price-section { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 10px; border-top: 1px solid #eeeeee; }
        .price-pix-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .price-pix-value { font-size: 20px; font-weight: 700; color: var(--primary-dark); }
        .price-card-value { font-size: 11px; color: var(--text-muted); text-align: right; }

        .whatsapp-btn-full {
